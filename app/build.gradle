plugins {
  id 'com.android.application'
  id 'org.jetbrains.kotlin.android'
  id 'org.jetbrains.kotlin.kapt'
}
android {
  namespace 'kz.terensai.rhythm'
  compileSdk 35
  defaultConfig {
    applicationId = project.hasProperty('paritmPreview21') ? 'kz.paritm.b21.preview' : (project.hasProperty('paritmPreview11') ? 'kz.paritm.b11.preview' : (project.hasProperty('paritmPreview') ? 'kz.paritm.preview.approved' : 'kz.terensai.rhythm'))
    manifestPlaceholders = [appLabel: (project.hasProperty('paritmPreview21') ? 'ПАРИТМ B2.1' : (project.hasProperty('paritmPreview11') ? 'ПАРИТМ B1.1' : (project.hasProperty('paritmPreview') ? 'ПАРИТМ B1+' : 'ПАРИТМ')))]
    buildConfigField 'boolean', 'B21_QA', project.hasProperty('paritmPreview21') ? 'true' : 'false'
    minSdk 26
    targetSdk 34
    testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    versionCode 5
    versionName '0.2.1-beta.1'
  }
  compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
  kotlinOptions { jvmTarget = '17' }
  buildFeatures { compose true; buildConfig true }
  composeOptions { kotlinCompilerExtensionVersion = '1.5.15' }
  testOptions { unitTests.returnDefaultValues = true }
}
dependencies {
  implementation 'androidx.room:room-runtime:2.6.1'
  implementation 'androidx.room:room-ktx:2.6.1'
  implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
  kapt 'androidx.room:room-compiler:2.6.1'
  implementation 'androidx.activity:activity-compose:1.9.3'
  implementation platform('androidx.compose:compose-bom:2024.10.01')
  implementation 'androidx.compose.material3:material3'
  implementation 'androidx.compose.foundation:foundation'
  implementation 'androidx.compose.ui:ui-tooling-preview'
  debugImplementation 'androidx.compose.ui:ui-tooling'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20240303'
  androidTestImplementation 'androidx.test.ext:junit:1.2.1'
  androidTestImplementation 'androidx.test:core:1.6.1'
  androidTestImplementation 'androidx.room:room-testing:2.6.1'
}
kapt { correctErrorTypes = true }
