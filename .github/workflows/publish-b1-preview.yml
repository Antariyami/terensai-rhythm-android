name: Publish PARITM B1 preview APK
on:
  push:
    branches:
      - feature/0.2b1-welcome-programs
    paths:
      - '.github/workflows/publish-b1-preview.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-b1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build isolated preview
        run: gradle --no-daemon -PparitmPreview :app:testDebugUnitTest :app:assembleDebug
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Publish first B1 download release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.2.0-b1-preview-1"
          FILE="paritm-b1-preview-0.2.0.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release tag already exists. Refuse to replace a previously downloaded APK." >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" \
            --title "ПАРИТМ B1 — первый просмотр экранов" \
            --notes "Пробный APK для Xiaomi 13T Pro: приветствие, плитки программ и адаптивная иконка. Только «Танысу» открывает прежний таймер. Отдельный applicationId kz.paritm.preview, поэтому установка не удаляет приложение 0.1 и не переносит его архив. Это тестовая сборка, подписанная временным debug-ключом." \
            --prerelease
