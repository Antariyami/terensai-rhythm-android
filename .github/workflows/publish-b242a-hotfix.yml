name: PARITM B2.4.2a hotfix — restore work
on:
  push:
    branches: [fix/b2-4-2a-restore-personal-work]
    paths: ['.github/workflows/publish-b242a-hotfix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: SDK
        run: |
          S="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          "$S" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build
        run: gradle --no-daemon -PparitmPreview242a :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: paritm-b242a-restore-hotfix-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Release QA
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk paritm-b242a-work-restore-qa.apk
          gh release create v0.2.4.2a-restore-qa-1 paritm-b242a-work-restore-qa.apk --target "$GITHUB_SHA" --prerelease --title "ПАРИТМ B2.4.2a · восстановление процедур" --notes "Hotfix: paused work restored from Room; visible under My Shift and My participation. Requires device QA."
