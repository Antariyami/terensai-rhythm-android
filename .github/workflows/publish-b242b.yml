name: PARITM B2.4.2b — One Active Personal Timer QA
on:
  push:
    branches: [feature/b2-4-2b-multiple-work]
    paths: ['.github/workflows/publish-b242b.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Run unit tests and compile QA APK and Android tests
        run: gradle --no-daemon -PparitmPreview242b :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Always upload debug APK as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: paritm-b242b-single-active-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish optional pre-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.2.4.2b-qa-1
          FILE=paritm-b242b-one-active-timer-qa.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "ПАРИТМ B2.4.2b · один активный таймер" \
              --notes "QA app with initial Андрей and Олжас profiles; one RUNNING work timer per master, other work auto-paused transactionally; active/finished work lists. Separate application ID kz.paritm.b242b.preview. Room v5. Android instrumented tests compiled but not run."
          fi
