name: PARITM B2.1 — session persistence QA APK
on:
  push:
    branches: [feature/b2-1-persistent-sessions]
    paths: ['.github/workflows/publish-b2-1-persistence.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and build QA APK + device-test APK
        run: gradle --no-daemon -PparitmPreview21 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish immutable QA release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.2.1-b21-qa-1"
          FILE="paritm-b2-1-persistence-qa.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          test -s "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" --prerelease \
            --title "ПАРИТМ B2.1 · тест сохранения сессий" \
            --notes "Отдельный тестовый APK kz.paritm.b21.preview; не трогает предыдущие приложения. Каталог → Проверка B2.1 · сохранение сессии: создать учебную сессию, начать, пауза, выйти, вернуть, завершить. Реальное Room-хранилище и event log. Сценарий содержит условные 15/5 минут, НЕ корпоративный стандарт. Основной красивый таймер появится в B2.2. Старый пилотный Java экран «Танысу» оставлен до безопасной миграции. Подпись временная debug; обновление поверх следующей тестовой версии не обещаем."
      - name: Upload instrumentation APK for later device runner
        uses: actions/upload-artifact@v4
        with:
          name: paritm-b21-android-tests
          path: app/build/outputs/apk/androidTest/debug/
          if-no-files-found: error
