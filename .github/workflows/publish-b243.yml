name: PARITM B2.4.3 — Work Journal QA
on:
  push:
    branches: [feature/b2-4-3-work-journal]
    paths: ['.github/workflows/publish-b243.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and APK compilation
        run: gradle --no-daemon -PparitmPreview243 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload QA APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: paritm-b243-journal-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish pre-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.2.4.3-journal-qa-2
          FILE=paritm-b243-journal-qa.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "ПАРИТМ B2.4.3 · Журнал работы" \
              --notes "Local offline S13 journal, day + status + suite + PM1 filters, copy/share daily completed-work report, append-only audited corrections to report minutes; Room v5→v6. Historical events retained. Separate QA app ID; B2.4.2b data not auto-migrated. Android instrumented tests compile but are not executed in CI."
          fi
