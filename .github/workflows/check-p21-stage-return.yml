name: PARITM P2.1 — Stage Return QA
on:
  push:
    branches: [feature/p2-1-reopen-previous-stage]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests, isolated QA APK, Android test APK compilation
        run: gradle --no-daemon -PparitmPreviewP21 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: QA APK artifact (not stable release)
        uses: actions/upload-artifact@v4
        with:
          name: paritm-p21-stage-return-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
