name: PARITM B2.4.2a — external PM1 QA
on:
  push:
    branches: [feature/b2-4-2a-suites-external]
    paths: ['.github/workflows/publish-b2-4-2a.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests and Android compile
        run: gradle --no-daemon -PparitmPreview242a :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Release after all checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.2.4.2a-qa-2
          FILE=paritm-b2-4-2a-external-pm1-qa.apk
          if gh release view "$TAG" >/dev/null 2>&1; then exit 1; fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          test -s "$FILE"
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
            --title "ПАРИТМ B2.4.2a · внешний PM1" \
            --notes "Independent offline QA app. Editable preset TERENSAI suites, guest entry, external PM1, suite and procedure type saved in Room v5. Finance PIN requirement documented but not implemented. Other personal procedures and calendar follow in subsequent versions. Temporary debug signature."
