name: PARITM B2.2 — main timer preview
on:
  push:
    branches: [feature/b2-2-timeline-ui]
    paths: ['.github/workflows/publish-b2-2.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and preview builds
        run: gradle --no-daemon -PparitmPreview22 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish QA download after green CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.2.2-b22-preview-1"
          FILE="paritm-b2-2-workflow-qa.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing release" >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          test -s "$FILE"
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
            --title "ПАРИТМ B2.2 · основной ход программы" \
            --notes "Separate debug QA app kz.paritm.b22.preview. New Room-backed Tanysu 180-minute editable pilot route, setup with suite/guest count, S04 active stage controls, real clock, plan/fact and event log, custom ambient style. Old app and earlier previews unaffected. Not a corporate regulation; stage minutes sample. Focus landscape/portrait arrives in B3. Debug signature is ephemeral."
