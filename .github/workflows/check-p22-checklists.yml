name: PARITM P2.2 — Checklists QA
on:
  push:
    branches: [feature/p2-2-checklist-foundation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM unit tests + isolated P2.2 APK + Android instrumentation APK compilation
        run: gradle --no-daemon -PparitmPreviewP22 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload P2.2 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: paritm-p22-checklists-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
