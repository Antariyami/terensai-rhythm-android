name: PARITM B2.2.1 — quick controls QA
on:
  push:
    branches: [feature/b2-2-1-quick-controls]
    paths: ['.github/workflows/publish-b2-2-1.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests and Android builds
        run: gradle --no-daemon -PparitmPreview221 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish immutable preview only after all checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.2.2.1-b221-qa-1"
          FILE="paritm-b2-2-1-quick-controls-qa.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing overwrite" >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          test -s "$FILE"
          gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
            --title "ПАРИТМ B2.2.1 · быстрые минуты и сьюты" \
            --notes "Separate QA app kz.paritm.b221.preview. Tap ±1/±5 to change minutes; manage an offline suite list (add/rename/remove), select from dropdown; green Опережение vs orange Отставание. Existing B2.2 Room workflow, timing and stages retained. User's stage times remain provisional. Parallel routes are designed only (B3.3 implementation next); this build does not change active stage order. New isolated applicationId has separate Room data. Temporary debug signature."
      - name: Upload Android instrumentation APK
        uses: actions/upload-artifact@v4
        with:
          name: paritm-b221-android-tests
          path: app/build/outputs/apk/androidTest/debug/
          if-no-files-found: error
