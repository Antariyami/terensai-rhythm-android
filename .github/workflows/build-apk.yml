name: Check Android core and build debug APK
on:
  push:
    branches: [main, 'feature/**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || (echo "sdkmanager not found in $ANDROID_HOME" && exit 1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and debug APK
        run: |
          if [ "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" = "feature/b1-approved-ui" ]; then
            gradle --no-daemon -PparitmPreview :app:testDebugUnitTest :app:assembleDebug
          else
            gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          fi
      - name: Unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paritm-v0.2a-unit-tests
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Upload APK for QA (not signed release)
        uses: actions/upload-artifact@v4
        with:
          name: paritm-b1-approved-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
