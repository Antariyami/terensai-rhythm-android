name: Build TERENSAI APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER" || (echo "sdkmanager not found in $ANDROID_HOME" && exit 1)
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload installable APK to Actions
        uses: actions/upload-artifact@v4
        with:
          name: terensai-rhythm-android-v0.1-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK in GitHub Releases for direct download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.1.0-test"
          FILE="terensai-rhythm-v0.1.0-test.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" --clobber
          else
            gh release create "$TAG" "$FILE" \
              --target "$GITHUB_SHA" \
              --title "TERENSAI Rhythm v0.1.0 — first Android test" \
              --notes "Тестовая Android-сборка Ритм парения (Танысу, таймеры и журнал). Устанавливайте только из официального репозитория. Debug APK для проверки на Xiaomi 13T Pro." \
              --prerelease
          fi
