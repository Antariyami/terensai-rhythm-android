name: PARITM P2.6 — Editable TERENSAI routes QA
on:
  push:
    branches: [feature/p2-6-live-standard-routes]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, isolated APK and instrumented-test APK compilation
        run: gradle --no-daemon -PparitmPreviewP26 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload P2.6 QA APK (not production release)
        uses: actions/upload-artifact@v4
        with:
          name: paritm-p26-standard-routes-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
