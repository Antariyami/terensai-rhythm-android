name: Publish PARITM B1 approved-style QA
on:
  push:
    branches: [feature/b1-approved-ui]
    paths: ['.github/workflows/publish-b1-approved.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and isolated debug APK
        run: gradle --no-daemon -PparitmPreview :app:testDebugUnitTest :app:assembleDebug
      - name: Publish immutable QA APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.2.0-b1-approved-preview-2"
          FILE="paritm-b1-approved-qa.apk"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Tag already exists; refusing to replace a signed APK" >&2
            exit 1
          fi
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          test -s "$FILE"
          gh release create "$TAG" "$FILE" \
            --target "$GITHUB_SHA" --title "ПАРИТМ B1 — согласованный стиль, тестовый APK" \
            --notes "QA-only Android APK. Одобрено направление B1: настоящий медальон, экран приветствия, каталог программ, живые кнопки. Имеет изолированный applicationId kz.paritm.preview.approved, не заменяет 0.1 или раннюю B1. Превью-версия, подпись временным debug-ключом GitHub Runner, не предназначена для обновления поверх самой себя будущими сборками. Новые сценарии, Room-архив и план/факт появятся в B2/C. Перед отзывом проверить Xiaomi 13T Pro." \
            --prerelease
