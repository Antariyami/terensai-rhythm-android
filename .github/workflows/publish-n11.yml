name: PARITM N1.1 — Navigation and Telegram Archives QA
on:
  push:
    branches: [feature/n1-1-persistent-nav-reports-suites]
    paths: ['.github/workflows/publish-n11.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests, QA APK, Android test compilation
        run: gradle --no-daemon -PparitmPreviewN11 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: paritm-n11-nav-reports-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: GitHub prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.3.3-n11-qa-1
          FILE=paritm-n11-nav-telegram-qa.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "ПАРИТМ N1.1 · Постоянная навигация и Telegram архив" \
              --notes "Six-section navigation persists through Room-backed Shift and S13 reports; Masters moved to Settings; corrected suite defaults 1 Көркемдік, 2 Өркендеу, 3 Байлық, 4 Амандық, 5 Сәттілік with safe migration of pristine old defaults only. Telegram report Today/Month/6 months/All; compact text, long TXT, all-time escaped UTF-8 HTML via secure FileProvider. Android test APK compiled only; requires Xiaomi QA. Separate test appId kz.paritm.n11.preview; prior app data not transferred."
          fi
