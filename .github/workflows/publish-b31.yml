name: PARITM B3.1 — Fullscreen Focus QA
on:
  push:
    branches: [feature/b3-1-focus-portrait]
    paths: ['.github/workflows/publish-b31.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and compile QA app and instrumented test package
        run: gradle --no-daemon -PparitmPreview31 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: paritm-b31-focus-portrait-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Publish preview release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.3.1-b31-focus-qa-1
          FILE=paritm-b31-focus-portrait-qa.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "ПАРИТМ B3.1 · Полноэкранный таймер" \
              --notes "Portrait immersive focus for programme stage, countdown and overrun, progress, start/pause/resume/complete, system bars and stay-awake restored on exit. B2.4.3 journal remains. Separate QA app ID kz.paritm.b31.preview. No landscape yet (B3.2)."
          fi
