name: PARITM B2.4.3a hotfix — programme stage reports
on:
  push:
    branches: [fix/b243a-session-stage-journal]
    paths: ['.github/workflows/publish-b243a-stagefix.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: JVM tests + QA APK + Android instrumented test compile
        run: gradle --no-daemon -PparitmPreview243fix :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: paritm-telegram-stage-recovery-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Optional pre-release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.2.4.3a-stagefix-qa-1
          FILE=paritm-telegram-stagefix-qa.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "ПАРИТМ · исправление журнала этапов" \
              --notes "Hotfix S13: show stored completed programme stages, explicit idempotent attribution to personal work, original timestamps, Telegram counts only confirmed work. Room v6 to v7 migration. Isolated QA package kz.paritm.b243fix.preview: previous sandbox app data are NOT automatically visible here. Never uninstall prior QA app until data export is available."
          fi
