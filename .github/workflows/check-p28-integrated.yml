name: PARITM P2.8 Integrated QA — facts finish duty backups
on:
  push:
    branches: [feature/p2-8-stage-facts-safe-finish-duty-backup]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, QA APK and instrumentation APK compilation
        run: gradle --no-daemon -PparitmPreviewP28 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Publish isolated P2.8 APK (QA only)
        uses: actions/upload-artifact@v4
        with:
          name: paritm-p28-integrated-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
