name: PARITM P2.4 — Live procedures and timeline events QA
on:
  push:
    branches: [feature/p2-4-live-actions-programme-data]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests, isolated debug APK and AndroidTest compilation
        run: gradle --no-daemon -PparitmPreviewP24 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Upload P2.4 QA APK
        uses: actions/upload-artifact@v4
        with:
          name: paritm-p24-live-procedures-events-qa-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
