name: PARITM P1.0 — Approved Catalogue and Custom Programme QA
on:
  push:
    branches: [feature/p1-0-approved-programmes]
    paths: ['.github/workflows/publish-p10.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Android SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Unit tests and QA APK compile
        run: gradle --no-daemon -PparitmPreviewP10 :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest
      - uses: actions/upload-artifact@v4
        with:
          name: paritm-p10-catalogue-custom-qa
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
      - name: Optional GitHub prerelease
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG=v0.3.4-p10-qa-2
          FILE=paritm-p10-approved-catalogue-qa.apk
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" "$FILE" --target "$GITHUB_SHA" --prerelease \
              --title "ПАРИТМ P1.0 · каталог и Своя программа" \
              --notes "Only approved catalogue cards Tanysu, LIGHT, GRAND, PREMIUM, SUPREME, Custom; no retired SELECT/ORDA/TAN LIGHT/SPECIAL. Built-in routes other than Tanysu remain preview awaiting verified specification, not guessed. Custom programme editor: enter real stages, times and guest/master tracks, suite, guests, PM1; save snapshot and run through same Room timers. Separate QA appId kz.paritm.p10.preview: previous app data not migrated. Instrumented tests compiled but not executed by runner."
          fi
